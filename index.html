<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <!-- Encabezado principal -->
  <h1>Donation Form</h1>

  <!-- Formulario de donación -->
  <form>
    <!-- Datos personales -->
    <label for="full-name">Full Name:</label>
    <input type="text" name="name" id="full-name" required>

    <label for="email-address">Email Address:</label>
    <input type="email" name="email" id="email-address" required>

    <!-- Monto de la donación -->
    <label for="donation-amount">Donation Amount ($):</label>
    <input type="number" name="amount" id="donation-amount" required>

    <!-- Opciones de suscripción y envío -->
    <input type="checkbox" name="newsletter" id="subscribe">
    <label for="subscribe">Subscribe</label>

    <input type="submit" value="Send">
  </form>
</body>
</html>
